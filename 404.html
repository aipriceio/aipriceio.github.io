<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 ｜ aiprice</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--surface:#181818;--line:#272727;--muted:#9B9B9B;--ease:cubic-bezier(0.22,1,0.36,1)}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  background:#000;color:#F2F2F2;
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:24px;-webkit-font-smoothing:antialiased;
}
.box{max-width:680px;width:100%}
.code{
  font-size:60px;line-height:1;font-weight:700;
  background:linear-gradient(90deg,#FFFFFF,#9B9B9B);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
h1{margin:24px 0 0;font-size:30px;line-height:36px;font-weight:600}
p{margin:12px 0 0;color:var(--muted);font-size:16px;line-height:24px}
a.btn{
  display:inline-flex;align-items:center;margin-top:32px;padding:8px 12px;border-radius:8px;
  background:#fff;color:#000;font-weight:600;text-decoration:none;
  transition:background 300ms var(--ease),transform 300ms var(--ease);
}
a.btn:hover{background:#D8D8D8}
a.btn:active{transform:scale(0.98)}
a.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.links{margin-top:24px;display:flex;gap:24px}
.links a{color:var(--muted);font-size:14px;line-height:20px;text-decoration:none;transition:color 300ms var(--ease)}
.links a:hover{color:#fff}
</style>
</head>
<body>
  <main class="box">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>地址可能拼错了，或者页面已经被移动。想看实时报价可以回首页，或者直接去 aiprice.io。</p>
    <a class="btn" href="/">返回首页</a>
    <nav class="links" aria-label="其它入口">
      <a href="https://aiprice.io/?ch=gh-aipriceio" rel="noopener">aiprice.io 实时比价</a>
      <a href="https://aiprice.io/stock/?ch=gh-aipriceio" rel="noopener">全部商品</a>
      <a href="https://aiprice.io/about" rel="noopener">关于</a>
    </nav>
  </main>
</body>
</html>
